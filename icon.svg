<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7eb8f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8f09a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded rect background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="128" y1="160" x2="128" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="256" y1="140" x2="256" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="384" y1="160" x2="384" y2="380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="96" y1="280" x2="416" y2="280" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Chart bars (background, muted) -->
  <rect x="108" y="290" width="52" height="90" rx="8" fill="rgba(126,184,247,0.12)"/>
  <rect x="180" y="240" width="52" height="140" rx="8" fill="rgba(126,184,247,0.12)"/>
  <rect x="252" y="210" width="52" height="170" rx="8" fill="rgba(200,240,154,0.12)"/>
  <rect x="324" y="260" width="52" height="120" rx="8" fill="rgba(200,240,154,0.12)"/>

  <!-- Chart bars (filled, glowing) -->
  <rect x="108" y="310" width="52" height="70" rx="8" fill="rgba(126,184,247,0.35)"/>
  <rect x="180" y="260" width="52" height="120" rx="8" fill="rgba(126,184,247,0.45)"/>
  <rect x="252" y="230" width="52" height="150" rx="8" fill="rgba(200,240,154,0.45)"/>
  <rect x="324" y="275" width="52" height="105" rx="8" fill="rgba(200,240,154,0.35)"/>

  <!-- Trend line -->
  <polyline
    points="134,290 206,248 278,218 350,255"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Dots on trend line -->
  <circle cx="134" cy="290" r="9" fill="#7eb8f7" filter="url(#glow)"/>
  <circle cx="206" cy="248" r="9" fill="#9ecff8" filter="url(#glow)"/>
  <circle cx="278" cy="218" r="11" fill="#c8f09a" filter="url(#glow)"/>
  <circle cx="350" cy="255" r="9" fill="#b5e882" filter="url(#glow)"/>

  <!-- "G&M" monogram text -->
  <text
    x="256"
    y="152"
    font-family="Georgia, serif"
    font-size="58"
    font-weight="400"
    fill="#f0ede8"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.92"
  >G&amp;M</text>

  <!-- Thin decorative line under text -->
  <line x1="186" y1="165" x2="326" y2="165" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.5"/>
</svg>
